name: Slack Alert for Workflow Status

on:
  push:
    branches:
      - main

jobs:
  run-workflow:
    name: Run Workflow and Send Slack Alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: action/checkout@v4

      # Set Slack vars based on job status
      - name: Set Slack Message
        id: slack_vars
        if: ${{ always() }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "status_icon=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "status_color=36a64f" >> $GITHUB_OUTPUT
          else
            echo "status_icon=:x:" >> $GITHUB_OUTPUT
            echo "status_color=ff0000" >> $GITHUB_OUTPUT
          fi

      # Send Slack Alert
      - name: Send Slack Alert
        if: ${{ always() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#aws-updates",
              "text": "${{ steps.slack_vars.outputs.status_icon }} Workflow *${{ job.status }}* in repository *${{ github.repository }}* on branch *${{ github.ref_name }}*!",
              "attachments": [
                {
                  "color": "${{ steps.slack_vars.outputs.status_color }}",
                  "fields": [
                    { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                    { "title": "Workflow Run", "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>", "short": true }
                  ]
                }
              ]
            }
