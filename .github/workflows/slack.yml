name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run build
        run: |
          echo "🚀 Running build..."
          # Replace with your actual build command
          npm install
          npm run build

      - name: Notify Slack
        uses: actions/slack@v1
        with:
        if: always()   # Runs even if build fails
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MESSAGE="✅ Build Passed on $GITHUB_REF"
          else
            MESSAGE="❌ Build Failed on $GITHUB_REF"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${MESSAGE}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: 'aws-updates'

