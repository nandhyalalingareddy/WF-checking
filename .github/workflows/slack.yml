name: Slack Alert for Workflow Status

on:
  push:
    branches:
      - main

jobs:
  run-workflow:
    name: Run Workflow and Send Slack Alert
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Send Slack Alert (always runs)
      - name: Send Slack Alert
        if: ${{ always() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKN }}
          payload: |
            {
              "channel": "#aws-updates",
              "text": "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} Workflow *${{ job.status }}* in repository *${{ github.repository }}* on branch *${{ github.ref_name }}*!",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '36a64f' || 'ff0000' }}",
                  "fields": [
                    { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                    { "title": "Workflow Run", "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>", "short": true }
                  ]
                }
              ]
            }
